
name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          pytest --alluredir=allure-results --numprocesses 2

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: error

  publish-report:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Allure Commandline
        run: |
          npm install --global allure-commandline@2.46.2
          allure --version

      - name: Restore Allure history
        run: |
          mkdir -p allure-results/history

          if [ -d gh-pages/history ]; then
            cp -a gh-pages/history/. allure-results/history/
          fi

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

          test -f allure-report/index.html

      - name: Save report history
        run: |
          mkdir -p report-archive

          if [ -d gh-pages/reports ]; then
            cp -a gh-pages/reports/. report-archive/
          fi

          cp -a allure-report "report-archive/${GITHUB_RUN_NUMBER}"

          mapfile -t old_reports < <(
            find report-archive -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -n
          )

          if [ "${#old_reports[@]}" -gt 20 ]; then
            for old in "${old_reports[@]:0:${#old_reports[@]}-20}"; do
              rm -rf "report-archive/$old"
            done
          fi

          mkdir -p allure-report/reports
          cp -a report-archive/. allure-report/reports/

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true
          keep_files: false
